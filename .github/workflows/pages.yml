name: Deploy walkthrough to GitHub Pages

# The walkthrough in docs/demo.html is authored as a fragment so the same file
# can be published both here and as a standalone page. This wraps it in a
# minimal HTML document and deploys that.
#
# One-time setup, which no workflow can do for you: Settings -> Pages ->
# Source -> GitHub Actions. Until that is set, the deploy step fails with a
# 404 and the site URL stays a 404 as well.

on:
  push:
    # Deliberately no paths filter. A redeploy on every push to these branches
    # costs half a minute and removes the "why didn't it publish?" question.
    branches:
      - main
      - claude/adoring-clarke-fl9b3s
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wrap the fragment in a page
        run: |
          mkdir -p _site
          {
            printf '%s' '<!doctype html><html lang="en-CA"><head>'
            printf '%s' '<meta charset="utf-8">'
            printf '%s' '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '%s' '<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>'
            printf '%s' '</head><body>'
            cat docs/demo.html
            printf '%s' '</body></html>'
          } > _site/index.html
          # Pages ignores Jekyll entirely when the source is GitHub Actions, but
          # this keeps the output correct if the source is ever switched back.
          touch _site/.nojekyll

      - name: Check the page came out whole
        run: |
          # A silently truncated or empty page is worse than a failed build,
          # because it deploys and looks fine until you click something.
          test -s _site/index.html || { echo "::error::_site/index.html is empty"; exit 1; }
          grep -q '<title>ListKit Walkthrough</title>' _site/index.html \
            || { echo "::error::title missing — the fragment did not get copied in"; exit 1; }
          grep -q '</body></html>$' _site/index.html \
            || { echo "::error::closing tags missing — the wrap did not finish"; exit 1; }
          grep -q 'data-step="3"' _site/index.html \
            || { echo "::error::step rail missing — the fragment looks truncated"; exit 1; }
          echo "index.html looks complete ($(wc -c < _site/index.html) bytes)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Where it went
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}"

      - name: Why the deploy failed
        if: failure()
        run: |
          echo "::error::Deploy failed. The usual cause is that GitHub Pages is not enabled yet."
          echo "Open https://github.com/${GITHUB_REPOSITORY}/settings/pages,"
          echo "set Source to 'GitHub Actions', then re-run this workflow."
